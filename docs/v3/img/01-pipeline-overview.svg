<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4A5568"/>
    </marker>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="480" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="460" y="32" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="bold" fill="#1A202C" text-anchor="middle">两条工程链路：优化前的人工流程与耗时</text>

  <!-- Pipeline 1: 评测工程 -->
  <rect x="30" y="55" width="870" height="170" rx="10" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="60" y="80" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">链路一：评测工程（新增 Benchmark）</text>

  <!-- Steps -->
  <rect x="60" y="100" width="120" height="50" rx="6" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="120" y="121" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">获取开源</text>
  <text x="120" y="137" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">评测代码</text>

  <line x1="180" y1="125" x2="210" y2="125" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="215" y="100" width="120" height="50" rx="6" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="275" y="121" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">理解评测逻辑</text>
  <text x="275" y="137" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">分析代码</text>

  <line x1="335" y1="125" x2="365" y2="125" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="370" y="100" width="120" height="50" rx="6" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="430" y="121" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">适配到</text>
  <text x="430" y="137" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">ComputeMetrics</text>

  <line x1="490" y1="125" x2="520" y2="125" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="525" y="100" width="120" height="50" rx="6" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="585" y="121" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">转换数据格式</text>
  <text x="585" y="137" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">+ 配置 YAML</text>

  <line x1="645" y1="125" x2="675" y2="125" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="680" y="100" width="120" height="50" rx="6" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="740" y="121" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">运行验证</text>
  <text x="740" y="137" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">对齐效果</text>

  <!-- Time label -->
  <rect x="60" y="170" width="740" height="28" rx="4" fill="#FED7D7" fill-opacity="0.6"/>
  <text x="430" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#C53030" text-anchor="middle">人工耗时：~2 天（开发 1-1.5天 + 验证 0.5天）</text>

  <!-- Pipeline 2: 模型结构 -->
  <rect x="30" y="245" width="870" height="210" rx="10" fill="#F0FFF4" stroke="#276749" stroke-width="1.5" filter="url(#sh)"/>
  <text x="60" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#276749">链路二：模型结构实验（结构改动全链路）</text>

  <!-- Steps row 1 -->
  <rect x="60" y="290" width="150" height="50" rx="6" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="135" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">参考论文/开源代码</text>
  <text x="135" y="327" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">适配训练代码 (vivolm)</text>
  <text x="135" y="350" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#718096" text-anchor="middle">0.5-1 天</text>

  <line x1="210" y1="315" x2="250" y2="315" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="255" y="290" width="150" height="50" rx="6" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="330" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">同步 blue-model</text>
  <text x="330" y="327" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">(HuggingFace 适配)</text>
  <text x="330" y="350" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#718096" text-anchor="middle">2-3 天</text>

  <line x1="405" y1="315" x2="445" y2="315" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="450" y="290" width="150" height="50" rx="6" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="525" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">模型格式转换</text>
  <text x="525" y="327" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">(Megatron → HF)</text>
  <text x="525" y="350" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#718096" text-anchor="middle">0.5 天</text>

  <line x1="600" y1="315" x2="640" y2="315" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="645" y="290" width="150" height="50" rx="6" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="720" y="311" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">加载验证 + 评测</text>
  <text x="720" y="327" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">推理对齐</text>
  <text x="720" y="350" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#718096" text-anchor="middle">1-2 天</text>

  <!-- Time label -->
  <rect x="60" y="365" width="735" height="28" rx="4" fill="#FED7D7" fill-opacity="0.6"/>
  <text x="430" y="384" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#C53030" text-anchor="middle">人工耗时：4 - 6.5 天</text>

  <!-- Common traits -->
  <text x="460" y="430" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#4A5568" text-anchor="middle">共同特点：流程模式化 | 框架规范严格 | 多文件协同 | 有明确验证标准</text>
  <text x="460" y="455" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#1A202C" text-anchor="middle">→ 最适合用 Skill 自动化的场景</text>
</svg>
