<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4A5568"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2B6CB0"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#276749"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B46C1"/>
    </marker>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="560" fill="#FAFBFC"/>
  <text x="480" y="30" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="bold" fill="#1A202C" text-anchor="middle">7 个 Skill 的协作关系（v-{domain}-{purpose} 命名）</text>

  <!-- Pipeline 1: 评测链路 -->
  <rect x="30" y="50" width="900" height="200" rx="10" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#sh)"/>
  <text x="60" y="72" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">评测链路（3 个独立 Skill，可单独触发）</text>

  <!-- Input 1 -->
  <rect x="60" y="90" width="130" height="45" rx="6" fill="#fff" stroke="#718096" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="125" y="110" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">GitHub/GitLab URL</text>
  <text x="125" y="125" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">/ 本地评测代码</text>

  <line x1="190" y1="112" x2="220" y2="112" stroke="#2B6CB0" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Skill 1 -->
  <rect x="225" y="85" width="210" height="55" rx="8" fill="#2B6CB0" filter="url(#sh)"/>
  <text x="330" y="108" font-family="Menlo, Monaco, monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">v-eval-code-adapter</text>
  <text x="330" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#BEE3F8" text-anchor="middle">评测代码适配</text>

  <!-- Output 1 -->
  <line x1="435" y1="112" x2="465" y2="112" stroke="#2B6CB0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="470" y="90" width="130" height="45" rx="6" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="535" y="110" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">bench/task/*.py</text>
  <text x="535" y="125" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">+ task_info.yaml</text>

  <!-- Input 2 -->
  <rect x="60" y="150" width="130" height="40" rx="6" fill="#fff" stroke="#718096" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="125" y="167" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">原始数据文件</text>
  <text x="125" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">.json/.csv/.xlsx</text>

  <line x1="190" y1="170" x2="220" y2="170" stroke="#2B6CB0" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Skill 2 -->
  <rect x="225" y="147" width="210" height="55" rx="8" fill="#2B6CB0" filter="url(#sh)"/>
  <text x="330" y="170" font-family="Menlo, Monaco, monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">v-eval-dataset-adapter</text>
  <text x="330" y="188" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#BEE3F8" text-anchor="middle">数据格式转换</text>

  <!-- Output 2 -->
  <line x1="435" y1="174" x2="465" y2="174" stroke="#2B6CB0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="470" y="152" width="130" height="40" rx="6" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="535" y="170" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">标准 JSONL</text>
  <text x="535" y="185" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">+ 转换脚本</text>

  <!-- Skill 3: result analyzer -->
  <rect x="640" y="90" width="210" height="55" rx="8" fill="#2B6CB0" filter="url(#sh)"/>
  <text x="745" y="108" font-family="Menlo, Monaco, monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">v-eval-result-analyzer</text>
  <text x="745" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#BEE3F8" text-anchor="middle">评测结果对比归因</text>

  <!-- Input 3 -->
  <rect x="640" y="152" width="210" height="40" rx="6" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="745" y="170" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">两份推理结果 → 对比报告</text>
  <text x="745" y="185" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#718096" text-anchor="middle">+ 退化归因 + knowledge 沉淀</text>

  <!-- Dotted connection from outputs to result analyzer -->
  <path d="M 600 112 L 640 112" fill="none" stroke="#2B6CB0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Pipeline 2: 模型结构链路 -->
  <rect x="30" y="270" width="900" height="180" rx="10" fill="#F0FFF4" stroke="#276749" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#sh)"/>
  <text x="60" y="292" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#276749">模型结构链路（2 个有序 Skill，前后串联）</text>

  <!-- Input -->
  <rect x="60" y="310" width="130" height="55" rx="6" fill="#fff" stroke="#718096" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="125" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">训练脚本 +</text>
  <text x="125" y="345" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">参考论文/代码</text>
  <text x="125" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">+ 适配逻辑</text>

  <line x1="190" y1="337" x2="220" y2="337" stroke="#276749" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Skill 4 -->
  <rect x="225" y="310" width="220" height="55" rx="8" fill="#276749" filter="url(#sh)"/>
  <text x="335" y="333" font-family="Menlo, Monaco, monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">v-vivolm-feature-adapter</text>
  <text x="335" y="351" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#9AE6B4" text-anchor="middle">训练代码结构适配 (Megatron)</text>

  <!-- Mid output -->
  <line x1="445" y1="337" x2="475" y2="337" stroke="#276749" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="480" y="313" width="130" height="50" rx="6" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="545" y="333" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">修改后源码 +</text>
  <text x="545" y="349" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">训练脚本</text>
  <text x="545" y="367" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#718096" text-anchor="middle">↓ 训练产出 ckpt</text>

  <!-- Arrow to Skill 5 -->
  <line x1="610" y1="337" x2="640" y2="337" stroke="#276749" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Skill 5 -->
  <rect x="645" y="310" width="210" height="55" rx="8" fill="#276749" filter="url(#sh)"/>
  <text x="750" y="333" font-family="Menlo, Monaco, monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">v-model-hf-converter</text>
  <text x="750" y="351" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#9AE6B4" text-anchor="middle">HF 适配 + 格式转换</text>

  <!-- Final output -->
  <rect x="645" y="375" width="210" height="35" rx="6" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="750" y="397" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#2D3748" text-anchor="middle">blue-model 代码 + HF 格式模型</text>

  <!-- Serial label -->
  <text x="545" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#276749" text-anchor="middle">串联：训练侧适配 → 推理侧同步</text>

  <!-- Pipeline 3: 训练分析链路 -->
  <rect x="30" y="470" width="900" height="75" rx="10" fill="#FAF5FF" stroke="#6B46C1" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#sh)"/>
  <text x="60" y="492" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#6B46C1">训练分析链路（2 个辅助 Skill）</text>

  <!-- Skill 6 -->
  <rect x="60" y="505" width="210" height="32" rx="6" fill="#6B46C1" filter="url(#sh)"/>
  <text x="165" y="525" font-family="Menlo, Monaco, monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">v-tensorboard-analyzer</text>

  <text x="290" y="525" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4A5568">2 组实验统计对比</text>

  <!-- Skill 7 -->
  <rect x="480" y="505" width="210" height="32" rx="6" fill="#6B46C1" filter="url(#sh)"/>
  <text x="585" y="525" font-family="Menlo, Monaco, monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">v-experiment-reporter</text>

  <text x="710" y="525" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4A5568">≥2 组实验综合报告</text>
</svg>
