<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A5568"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2B6CB0"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="35" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#1A202C" text-anchor="middle">知识沉淀闭环：issues → knowledge → Skill 执行</text>

  <!-- Box 1: Skill 执行任务 -->
  <rect x="60" y="70" width="220" height="90" rx="12" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="100" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#2B6CB0" text-anchor="middle">Skill 执行任务</text>
  <text x="170" y="125" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">评测适配 / 模型结构适配</text>
  <text x="170" y="145" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">数据转换 / 模型转换</text>

  <!-- Arrow 1→2 -->
  <line x1="280" y1="115" x2="355" y2="115" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="318" y="103" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#718096" text-anchor="middle">遇到问题</text>

  <!-- Box 2: 问题记录 -->
  <rect x="365" y="70" width="220" height="90" rx="12" fill="#FFF5F5" stroke="#C53030" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#C53030" text-anchor="middle">issues.md</text>
  <text x="475" y="123" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">记录：现象 / 原因 / 解决方式</text>
  <text x="475" y="145" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#718096" text-anchor="middle">原始素材，不做加工</text>

  <!-- Arrow 2→3 -->
  <line x1="585" y1="115" x2="655" y2="115" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="620" y="103" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#718096" text-anchor="middle">定期提炼</text>

  <!-- Box 3: knowledge.md -->
  <rect x="665" y="70" width="220" height="90" rx="12" fill="#F0FFF4" stroke="#276749" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#276749" text-anchor="middle">knowledge.md</text>
  <text x="775" y="123" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">结构化经验：高频问题</text>
  <text x="775" y="145" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">最佳实践 / 避坑指南</text>

  <!-- Feedback arrow: knowledge → skill (curved) -->
  <path d="M 775 160 L 775 220 Q 775 245 750 245 L 195 245 Q 170 245 170 220 L 170 160" fill="none" stroke="#2B6CB0" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrowhead-blue)"/>
  <text x="470" y="272" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0" text-anchor="middle">执行前读取 knowledge.md → 带着历史经验执行，避免重复踩坑</text>
</svg>
