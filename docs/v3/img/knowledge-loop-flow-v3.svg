<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A5568"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2B6CB0"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#A0AEC0"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="380" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="480" y="35" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#1A202C" text-anchor="middle">知识沉淀三层金字塔：issues.md → knowledge.md → issues_archive.md</text>

  <!-- Box 1: Skill 执行任务 -->
  <rect x="40" y="70" width="200" height="90" rx="12" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="100" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0" text-anchor="middle">Skill 执行任务</text>
  <text x="140" y="123" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">评测适配 / 模型结构适配</text>
  <text x="140" y="143" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">数据转换 / 模型转换</text>

  <!-- Arrow 1→2 -->
  <line x1="240" y1="115" x2="295" y2="115" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="268" y="103" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">遇到问题</text>

  <!-- Box 2: issues.md (活跃案例层) -->
  <rect x="305" y="70" width="220" height="90" rx="12" fill="#FFF5F5" stroke="#C53030" stroke-width="2" filter="url(#shadow)"/>
  <text x="415" y="96" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#C53030" text-anchor="middle">issues.md</text>
  <text x="415" y="116" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">活跃案例层（max 3/原则）</text>
  <text x="415" y="136" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">症状 → 诊断 → 修复</text>
  <text x="415" y="152" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">当前：15 个活跃 case（744 行）</text>

  <!-- Arrow 2→3 -->
  <line x1="525" y1="115" x2="580" y2="115" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="553" y="103" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">提炼</text>

  <!-- Box 3: knowledge.md (原则层) -->
  <rect x="590" y="70" width="220" height="90" rx="12" fill="#F0FFF4" stroke="#276749" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="96" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#276749" text-anchor="middle">knowledge.md</text>
  <text x="700" y="116" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">原则层（通用方法论）</text>
  <text x="700" y="136" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#718096" text-anchor="middle">M/P/C/D/V/F 六大主题</text>
  <text x="700" y="152" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">当前：6 主题、20+ 条原则</text>

  <!-- Box 4: issues_archive.md (归档层) -->
  <rect x="305" y="200" width="220" height="70" rx="12" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="415" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#718096" text-anchor="middle">issues_archive.md</text>
  <text x="415" y="248" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#A0AEC0" text-anchor="middle">归档层（FIFO 淘汰旧案例）</text>
  <text x="415" y="263" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#CBD5E0" text-anchor="middle">保留可追溯性</text>

  <!-- FIFO arrow from issues to archive -->
  <line x1="415" y1="160" x2="415" y2="200" stroke="#A0AEC0" stroke-width="1.5" marker-end="url(#arrowhead-gray)"/>
  <text x="450" y="183" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#A0AEC0">FIFO 淘汰</text>

  <!-- Feedback arrow: knowledge → skill (curved) -->
  <path d="M 700 160 L 700 310 Q 700 335 675 335 L 165 335 Q 140 335 140 310 L 140 160" fill="none" stroke="#2B6CB0" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrowhead-blue)"/>
  <text x="420" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0" text-anchor="middle">执行前必须通读 knowledge.md + issues.md → 带着历史经验执行，避免重复踩坑</text>

  <!-- Pyramid label on right -->
  <rect x="840" y="75" width="100" height="195" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
  <text x="890" y="105" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="bold" fill="#276749" text-anchor="middle">原则层</text>
  <text x="890" y="125" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#718096" text-anchor="middle">精简抽象</text>
  <line x1="850" y1="140" x2="930" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <text x="890" y="165" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="bold" fill="#C53030" text-anchor="middle">活跃层</text>
  <text x="890" y="185" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#718096" text-anchor="middle">具体详实</text>
  <line x1="850" y1="200" x2="930" y2="200" stroke="#E2E8F0" stroke-width="1"/>
  <text x="890" y="225" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="bold" fill="#718096" text-anchor="middle">归档层</text>
  <text x="890" y="245" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#A0AEC0" text-anchor="middle">冷存储</text>
  <text x="890" y="265" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#CBD5E0" text-anchor="middle">↓ 信息密度</text>
</svg>
